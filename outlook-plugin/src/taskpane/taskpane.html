<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Junk Be Gone</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-Fabric" style="margin: 0; background: var(--bg, #ffffff); color: var(--fg, #1b1b1b);">
    <section id="sideload-msg" style="padding: 20px;">
        <h2 class="ms-font-xl">Please <a target="_blank" href="https://learn.microsoft.com/office/dev/add-ins/testing/test-debug-office-add-ins#sideload-an-office-add-in-for-testing">sideload</a> your add-in to see app body.</h2>
    </section>
    <main id="app-body" style="display: none; flex-direction: column; padding: 16px;">
        <h2 class="ms-font-xl" style="margin: 0 0 8px 0;">Junk Be Gone</h2>
        <p class="ms-font-m">Deletes junk mail from senders matching the list below, plus anything you've flagged in the Junk folder. The list is shared with the scheduled cleanup.</p>

        <label for="badwords" class="ms-font-m" style="font-weight: 600; margin-bottom: 4px;">Bad words (one per line, matched against sender name/address; use /pattern/flags for regex):</label>
        <textarea id="badwords" rows="6" style="width: 100%; box-sizing: border-box; color: var(--fg, #1b1b1b); background: var(--bg, #ffffff); border: 1px solid #8a8886; font-family: inherit; font-size: 14px; padding: 6px;"></textarea>

        <button id="save-badwords" style="margin-top: 10px; padding: 8px 16px; background: var(--bg, #ffffff); color: var(--fg, #1b1b1b); border: 1px solid #8a8886; border-radius: 2px; cursor: pointer; font-size: 14px;">
            Save List
        </button>

        <div style="display: flex; gap: 10px; margin-top: 16px;">
            <button id="preview" style="flex: 1; padding: 10px 20px; background: var(--bg, #ffffff); color: var(--fg, #1b1b1b); border: 1px solid #8a8886; border-radius: 2px; cursor: pointer; font-size: 16px;">
                Preview
            </button>
            <button id="run" style="flex: 1; padding: 10px 20px; background: #0078d7; color: #ffffff; border: none; border-radius: 2px; cursor: pointer; font-size: 16px;">
                Run Cleanup
            </button>
        </div>

        <pre id="result" class="ms-font-m" style="white-space: pre-wrap; text-align: left; margin-top: 16px; color: var(--fg, #1b1b1b);"></pre>
    </main>
</body>

</html>
